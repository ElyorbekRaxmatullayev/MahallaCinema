# mahalla-cinema.raxel.uz
#
# App runs under basePath=/cinema (see next.config.ts) — everything at "/"
# outside that prefix is intentionally left to Next.js's own not-found page.
# Static build output and uploads are served directly by nginx; everything
# else is proxied to the systemd-managed Next.js process on 127.0.0.1:3000.
#
# Установка:
#   cp deploy/nginx.conf /etc/nginx/sites-available/mahalla-cinema.raxel.uz
#   ln -s /etc/nginx/sites-available/mahalla-cinema.raxel.uz /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d mahalla-cinema.raxel.uz

server {
    server_name mahalla-cinema.raxel.uz;

    access_log /var/log/nginx/mahalla-cinema.access.log;
    error_log  /var/log/nginx/mahalla-cinema.error.log;

    # Poster/broadcast photo uploads from the admin panel.
    client_max_body_size 20m;

    location /cinema/uploads/ {
        alias /home/MahallaCinema/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options nosniff;
    }

    location /cinema/_next/static/ {
        alias /home/MahallaCinema/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 80;
}
